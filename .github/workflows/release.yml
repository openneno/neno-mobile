# main 分支每次提交: 运行测试, 构建签名的 release APK, 发布新版本
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置:
#   NENO_KEYSTORE_BASE64     发布签名 keystore 文件的 base64
#   NENO_KEYSTORE_PASSWORD   keystore 密码
#   NENO_KEY_ALIAS           key 的别名
#   NENO_KEY_PASSWORD        key 的密码
# 所有版本必须使用同一个 keystore 签名, 否则用户无法覆盖安装新版本.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # 版本号: 1.0.<构建序号>; 修改主版本时改这里
  VERSION_BASE: "1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          name="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "版本 $name ($code)"

      - name: Decode keystore
        env:
          NENO_KEYSTORE_BASE64: ${{ secrets.NENO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NENO_KEYSTORE_BASE64" ]; then
            echo "::error::缺少发布签名: 请在仓库 Secrets 中配置 NENO_KEYSTORE_BASE64 等 4 个变量(见本文件开头)"
            exit 1
          fi
          echo "$NENO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/neno-release.jks"
          echo "NENO_KEYSTORE=$RUNNER_TEMP/neno-release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          NENO_KEYSTORE_PASSWORD: ${{ secrets.NENO_KEYSTORE_PASSWORD }}
          NENO_KEY_ALIAS: ${{ secrets.NENO_KEY_ALIAS }}
          NENO_KEY_PASSWORD: ${{ secrets.NENO_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          apk="neno-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # 确认使用了发布签名, 而不是 debug 签名
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK 使用了 debug 签名"; exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s' "$prev"..HEAD --no-merges
            else
              git log --pretty=format:'- %s' --no-merges -n 30
            fi
            echo
            echo
            echo "## 安装"
            echo
            echo "下载下方的 \`$APK\` 安装。需要 Android 8.0 及以上。"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "NENO ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
